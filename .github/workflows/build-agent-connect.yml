name: Build TV Box Agent Connect
on:
  workflow_dispatch:
  push:
    paths:
      - 'AgentConnect/**'
      - '.github/workflows/build-agent-connect.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AgentConnect
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Box-Agent-Connect
          path: AgentConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
