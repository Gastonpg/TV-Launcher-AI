plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvlauncher.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvlaunch.pg'
        minSdk 28
        targetSdk 28
        versionCode 5
        versionName '2.2-glass'
        ndk { abiFilters 'armeabi-v7a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
